- key: platform_stock_blinkit
  name: Platform stock (DOH/SOH) — Blinkit
  group: stock
  plan_role: enhancer
  factors: [stock_cover, netting]
  missing_means: "Stock-cover factor and netting off"
  questions: "Stock, days on hand"
  header_rows: [2]
  signature: [backend_facility_id, item_id, backend_inv_qty, frontend_inv_qty, RR, DOH]
  writes: core.stock_snapshot
  filename_hints: [blinkit, doh, soh]
- key: market_category_insight
  name: Market data — Dcluttr category insight
  group: market
  plan_role: enhancer
  factors: [sell_through, osa_signal, market_ceiling]
  missing_means: "Sell-through, OSA signal and market ceiling off"
  questions: "Market share, OSA, competitor, price and discount"
  header_rows: [3]
  signature: [Date, Variant ID, Item ID, Brand, Category, Wt. OSA %, Est Category Share SP]
  writes: core.market_daily
  filename_hints: [dcluttr, categories, insight]
- key: sku_master
  name: SKU master
  group: sku_master
  plan_role: enhancer
  factors: [case_size, moq]
  missing_means: "Category from the template or Dcluttr; case size 1, no MOQ"
  questions: "Case pack, MOQ"
  header_rows: [1]
  signature: [SKU, case size, MOQ, category]
  writes: core.sku_master
  filename_hints: [sku master, master]
- key: custom
  name: Custom
  group: custom
  plan_role: enhancer
  factors: []
  missing_means: "Nothing in the plan changes"
  questions: "Questions about its own columns"
  header_rows: []
  signature: []
  writes: core.extra_value
  filename_hints: []
