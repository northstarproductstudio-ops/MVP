# File-type library. One entry = one adapter class in core/domain/adapters/.
# Seeded into core.file_type. signature: columns matched case/whitespace-insensitively.
# plan_role (Gap 8): essential = a demand plan cannot run without it; enhancer = it switches
# factors on and answers more questions, but a plan runs without it. factors / missing_means /
# questions are what the Ask agent says when the file is missing.
- key: erp_sales_orders
  name: ERP sales orders (Zoho)
  group: sellin
  plan_role: essential
  factors: [base, trend]
  missing_means: "No demand plan: the plan is built from sales history"
  questions: "Sales history, trends, plan questions"
  header_rows: [1]
  signature: [SalesOrder ID, Order Date, Status, Customer Name, SKU, QuantityOrdered, Branch ID]
  writes: core.sellin_line
  filename_hints: [so, sales order, salesorder, zoho]
- key: platform_po_instamart
  name: Platform PO — Instamart (Swiggy)
  group: po
  plan_role: enhancer
  factors: [fill_rate]
  missing_means: "Fill-rate factor off, open PO quantity unknown"
  questions: "Fill rate, open POs, lead time"
  header_rows: [1]
  signature: [PoNumber, FacilityId, City, OrderedQty, ReceivedQty, BalancedQty, SkuCode]
  writes: core.po_line
  filename_hints: [swiggy, instamart]
- key: platform_po_zepto
  name: Platform PO — Zepto
  group: po
  plan_role: enhancer
  factors: [fill_rate]
  missing_means: "Fill-rate factor off, open PO quantity unknown"
  questions: "Fill rate, open POs, lead time"
  header_rows: [1]
  signature: [PO No., Del Location, SKU, EAN, Qty, ASN Quantity, GRN Quantity]
  writes: core.po_line
  filename_hints: [zepto]
- key: platform_po_bigbasket
  name: Platform PO / fill rate — BigBasket
  group: po
  plan_role: enhancer
